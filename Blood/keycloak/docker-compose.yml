# Keycloak de développement : http://localhost:8180  (console admin : admin / admin)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --http-port=8180 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./blood-realm.json:/opt/keycloak/data/import/blood-realm.json:ro
      # Thème des pages de connexion / inscription aux couleurs de l'application
      - ./themes/bloodcare:/opt/keycloak/themes/bloodcare:ro
